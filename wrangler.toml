name = "gitvfs"
main = "src/worker.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# --- Workers Logs ---------------------------------------------------------
# Persistent, searchable log retention (3 days free tier, 7 on paid).
# Required for log-based alerts. Our worker emits structured JSON on every
# request (access log) and an elevated-severity `level: "warn"` line on
# `ingest_too_large`. Both are searchable via the dashboard once enabled.
# head_sampling_rate = 1.0 retains 100% of top-level invocations.
[observability]
enabled = true
head_sampling_rate = 1.0

# --- Smart placement ------------------------------------------------------
# Moves the Worker closer to where the DOs + tarball fetches run, reducing
# Worker→DO round-trip latency on cold colos. Free to turn on; no downsides.
[placement]
mode = "smart"

# --- Durable Object: one DO per (owner, repo, sha) -----------------------
# Holds file contents in embedded sqlite. Self-evicts 7 days after last
# access via Alarms (see RepoDO.alarm() + touchAlarm()).
[[durable_objects.bindings]]
name = "REPO"
class_name = "RepoDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoDO"]

# --- Rate limiting (per client IP) ---------------------------------------
# Cloudflare's Rate Limiting API. `limit` and `period` are counted PER KEY
# passed to `.limit({ key: ... })`. Our worker passes cf-connecting-ip, so
# these are per-client-IP quotas. Requests without an IP header share a
# single "anon" bucket. The X-Gitvfs-Key header bypasses these for our own
# tooling (see GITVFS_INTERNAL_KEY secret).
# namespace_id is arbitrary per-worker; different ints = independent buckets.

[[unsafe.bindings]]
name = "RL_EXPENSIVE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 10 }   # 30 /bash+/grep calls per IP per 10s

[[unsafe.bindings]]
name = "RL_GENERAL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 100, period = 10 }  # 100 of everything else per IP per 10s

# --- Metrics (Workers Analytics Engine) ----------------------------------
# Per-request data point: blobs=[action, source, status], doubles=[durationMs],
# indexes=[action]. Also writes an ingest-failure point on ingest_too_large.
# Query via the GraphQL Analytics API or Grafana's Cloudflare data source.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "gitvfs_metrics"

# --- Scheduled crons (optional) ------------------------------------------
# Not required — DO self-eviction via Alarms handles per-repo cleanup.
# Enable if we ever need a global sweep or cross-DO housekeeping.
#
# [triggers]
# crons = ["0 */6 * * *"]

# --- Secrets (managed outside this file) ---------------------------------
# Set via wrangler:
#   wrangler secret put GITHUB_TOKEN        # 5000 req/hr to the GitHub API
#   wrangler secret put GITVFS_INTERNAL_KEY # bypass per-IP rate limits
#
# Never commit these. Local copies live in .env (gitignored) for tests/bench.
